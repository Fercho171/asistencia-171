<button mat-stroked-button type="button" [matMenuTriggerFor]="exportMenu" [disabled]="exporting()">
  <mat-icon>download</mat-icon>
  {{ exporting() ? 'Exportando…' : 'Exportar' }}
</button>
<mat-menu #exportMenu="matMenu">
  <button mat-menu-item type="button" (click)="exportExcel()">
    <mat-icon>table_chart</mat-icon>
    <span>Excel</span>
  </button>
  <button mat-menu-item type="button" (click)="exportPdf()">
    <mat-icon>picture_as_pdf</mat-icon>
    <span>PDF</span>
  </button>
</mat-menu>
@if (error(); as message) {
  <p class="export-error" role="alert">{{ message }}</p>
}
